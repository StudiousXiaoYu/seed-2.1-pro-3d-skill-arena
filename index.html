<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Skill Arena</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/",
    "quarks.core": "./node_modules/quarks.core/dist/quarks.core.esm.js",
    "three.quarks": "./node_modules/three.quarks/dist/three.quarks.esm.js"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="title">3D Skill Arena <span id="skill-sub">五系法术 · 3D 对战实验场</span></div>
    <div class="tip"><b>鼠标</b>瞄准 · <b>左键</b>施法（火球按住蓄力） · <b>空格+左键</b>转视角 · 滚轮缩放 · <b>WASD</b>移动 · <b>Shift</b>奔跑 · <b>1-5</b>切技能 · 结算后按 <b>R</b> 重开</div>
    <div class="hp-block">
      <div class="hp-label">你的生命 <span id="hero-hp-num">100 / 100</span></div>
      <div class="hp-bar"><div id="hero-hp-fill" class="hp-fill"></div></div>
    </div>
  </div>

  <div id="enemy-hud">
    <div class="hp-label">敌方弓手 <span id="enemy-hp-num">220 / 220</span><span id="enemy-status"></span></div>
    <div class="hp-bar enemy"><div id="enemy-hp-fill" class="hp-fill"></div></div>
  </div>

  <div id="skill-desc"></div>
  <div id="skillbar"></div>
  <div id="fx-flash"></div>
  <div id="loading">正在加载特效资源…</div>

  <div id="overlay">
    <div class="end-panel">
      <h1 id="end-title">胜 利</h1>
      <p id="end-text"></p>
      <button id="restart-btn">重新开始</button>
      <div class="restart-hint">或按 <b>R</b> 键</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
